# Conda environment for tps-torch / committorch (recommended on Linux/macOS).
#
# OpenMM, PDBFixer, openmm-torch (PyTorch forces; same plugin as PyPI `openmmtorch`),
# and a modern libstdc++ (CXXABI) all come from conda-forge so native libraries match.
#
# From the repository root (so the editable install resolves):
#   conda env create -f environment.yml
#   conda activate tpstorch
#
# If `tpstorch` already exists with wrong packages, remove and recreate:
#   conda deactivate
#   conda env remove -n tpstorch -y
#   conda env create -f environment.yml
#   conda activate tpstorch
#
# If you created the env without the pip section, run:
#   pip install -e ".[dev]"
#
# If MACE/SciPy import fails (RecursionError in numpy dtype code) or
# transformers says packaging version is None: conda update to scipy>=1.14
# and a single clean packaging, or recreate the env with this file.
#
# Optional: after `conda activate`, you can `source scripts/conda-ld-library-path.sh`
# in new shells to prepend $CONDA_PREFIX/lib for every command (the Python
# entrypoints in this repo also do this in-process for OpenMM).
#
# GPU: this file targets CUDA 12.6 (pytorch=*=cuda126*, openmm-torch=*=cuda126*).
# Driver >= 525 and nvidia-smi "CUDA Version" >= 12.6 required.
# For CUDA 12.9 builds (newer driver only), change all cuda126 -> cuda129.

name: tpstorch
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Newer C++ ABI than many system libstdc++ — required by conda-forge libOpenMM.so
  - libstdcxx-ng>=12
  # Pin CUDA 12.6 so conda-forge resolves CUDA builds consistently
  - cuda-version=12.6
  # OpenMM: 8.2.x matches openmm-torch 1.5 CUDA 12.6 stack
  - openmm>=8.2,<8.3
  # openmm-torch CUDA 12.6 build (provides TorchForce for NN biases in MD)
  - openmm-torch=1.5.1=cuda126py312*
  - pdbfixer
  - mdtraj
  # scipy<1.14 with numpy 2.x can RecursionError in scipy.interpolate (breaks mace-torch)
  - numpy
  - scipy>=1.14
  - packaging>=23
  - pydantic>=2
  - tqdm
  # PyTorch 2.6.0 CUDA 12.6 build (GPU tensors + autograd)
  - pytorch=2.6.0=cuda126*
  - pytest>=7
  - pytest-cov
  - ruff
  - mypy
  - hypothesis
  - pip
  - pip:
      # mace-torch imports torchmetrics; an unpinned install can pull torch>=2.11 and
      # break the conda-forge pytorch=2.6 cuda126 / openmm-torch stack. Install first.
      - "torchmetrics>=1.3.0,<1.9.0"
      - "torch-ema>=0.3"
      - "lightning-utilities>=0.8.0,<0.16"
      # MACE foundation model support (auto-downloads MACE-OFF23, MACE-MP-0)
      - "mace-torch>=0.3.12"
      - "e3nn>=0.4.4"
      - "-e .[dev]"
