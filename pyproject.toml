
[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "committorch"
version = "0.1.0"
description = "Committor functions and reaction rates via ML-enhanced sampling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "M.R. Hasyim", email = "muhammad_hasyim@berkeley.edu"},
    {name = "C.B. Batton", email = "chbatton@berkeley.edu"},
]
keywords = ["committor", "rare-events", "enhanced-sampling", "reaction-rates", "molecular-dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    # scipy<1.14 + numpy 2.x can hit a dtype RecursionError when importing
    # scipy.interpolate (breaks mace-torch and other stacks).
    "scipy>=1.14",
    "pydantic>=2.0",
    "tqdm",
]

[project.optional-dependencies]
# IMPORTANT: The PyPI 'openmmtorch' package is a Python-only stub.  It does
# NOT include the C++/CUDA platform kernels required by TorchForce.  Without
# those kernels, TorchForce silently fails on ALL OpenMM platforms and the
# training loop falls back to unbiased MD.
#
# The ONLY supported installation path for openmm-torch is conda-forge:
#   conda install -c conda-forge openmm-torch
#
# The pip extras below install the Python wrapper for import compatibility,
# but you MUST also have the conda-forge native libraries.
openmm = [
    "openmm>=8.0",
    "openmmtorch>=1.5",
    "pdbfixer>=1.8",
]
openmm-from-conda = [
    "openmmtorch>=1.5",
]
mace = [
    "mace-torch>=0.3.12",
    "e3nn>=0.4.4",
    "packaging>=23.0",
]
equivariant = [
    "e3nn>=0.4.4",
    "mace-torch>=0.3.12",
    "schnetpack",
]
trajectory = [
    "mdtraj",
]
logging = [
    "tensorboard",
    "wandb",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
]
all = [
    "committorch[openmm,equivariant,trajectory,logging,dev]",
]

[project.urls]
Homepage = "https://github.com/muhammadhasyim/tps-torch"
Repository = "https://github.com/muhammadhasyim/tps-torch"

# src-layout package: `src/committorch/`
[tool.hatch.build.targets.wheel]
packages = ["src/committorch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "openmm: marks tests requiring OpenMM",
    "equivariant: marks tests requiring equivariant NN packages",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
