[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "committorch"
version = "0.1.0"
description = "Committor functions and reaction rates via ML-enhanced sampling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "M.R. Hasyim", email = "muhammad_hasyim@berkeley.edu"},
    {name = "C.B. Batton", email = "chbatton@berkeley.edu"},
]
keywords = ["committor", "rare-events", "enhanced-sampling", "reaction-rates", "molecular-dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "pydantic>=2.0",
    "tqdm",
]

[project.optional-dependencies]
openmm = [
    "openmm>=8.0",
    "openmm-torch>=1.5",
]
equivariant = [
    "e3nn",
    "mace-torch",
    "schnetpack",
]
trajectory = [
    "mdtraj",
]
logging = [
    "tensorboard",
    "wandb",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
]
all = [
    "committorch[openmm,equivariant,trajectory,logging,dev]",
]

[project.urls]
Homepage = "https://github.com/muhammadhasyim/tps-torch"
Repository = "https://github.com/muhammadhasyim/tps-torch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "openmm: marks tests requiring OpenMM",
    "equivariant: marks tests requiring equivariant NN packages",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
